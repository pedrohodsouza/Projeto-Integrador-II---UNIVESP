{% extends "oficina/base.html" %}

{% block title %}Início - Oficina Mecânica{% endblock %}

{% block content %}
<main class="page">
    <h1>Início</h1>
    <p id="clock" class="clock"></p>

    <div class="card-grid">
        <a class="card" href="{% url 'cliente_list' %}">Clientes</a>
        <a class="card" href="{% url 'veiculo_list' %}">Veículos</a>
        {% if user.is_staff %}
            <a class="card" href="{% url 'usuario_list' %}">Usuários</a>
        {% endif %}
    </div>
</main>
{% endblock %}
