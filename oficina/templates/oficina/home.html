{% extends "oficina/base.html" %}

{% block title %}Início - Oficina Mecânica{% endblock %}

{% block content %}
<div class="page">
    <div class="page-title-block">
        <h1>Início</h1>
        <p id="clock" class="clock"></p>
    </div>

    <div class="group-card">
        <a href="{% url 'cliente_list' %}" class="group-row is-link">
            <span class="row-icon row-icon--blue">👤</span>
            <span class="row-text">
                <span class="row-title">Clientes</span>
                <span class="row-subtitle">{{ cliente_count }} cadastrado{{ cliente_count|pluralize }}</span>
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="{% url 'veiculo_list' %}" class="group-row is-link">
            <span class="row-icon row-icon--slate">🚗</span>
            <span class="row-text">
                <span class="row-title">Veículos</span>
                <span class="row-subtitle">{{ veiculo_count }} cadastrado{{ veiculo_count|pluralize }}</span>
            </span>
            <span class="chevron">›</span>
        </a>
    </div>
</div>
{% endblock %}
